
services:
  backend:
    build: .
    image: chat_app:latest
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        python manage.py createadmin &&
        exec python -m daphne -b 0.0.0.0 -p 8000 config.asgi:application
      "
    volumes:
      - .:/app
      - static_files:/app/staticfiles
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      minio:
        condition: service_started
      clamav:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, urllib.error; exec(\"try:\\n urllib.request.urlopen('http://127.0.0.1:8000/api/', timeout=3)\\nexcept urllib.error.HTTPError:\\n pass\")"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - edge
      - internal

  celery:
    image: chat_app:latest
    command: celery -A config worker -l info -P solo
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_started
      minio:
        condition: service_started
      clamav:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - edge      # required for outbound Web Push (pywebpush → FCM/Mozilla/APNs)
      - internal  # retains access to redis, db, minio, clamav

  celery-beat:
    image: chat_app:latest
    command: celery -A config beat -l info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
      - db
      - minio
      - clamav
    restart: unless-stopped
    networks:
      - internal

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "127.0.0.1:6383:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - internal

  db:
    image: postgres:15
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - internal

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9005:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - internal
  clamav:
    image: clamav/clamav:latest
    container_name: chat_clamav
    ports:
      - "127.0.0.1:3314:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    environment:
      - CLAMAV_NO_FRESHCLAMD=false
    healthcheck:
      # clamdscan --ping sends a PING to clamd over the TCP socket configured
      # in /etc/clamav/clamd.conf (port 3310) and returns exit 0 only when the
      # daemon responds PONG — a genuine daemon-readiness check, not port-open.
      # --ping=3 allows up to 3 attempts per health-check invocation.
      # start_period is long because a cold start requires freshclamd to
      # download the initial signature database (~250 MB), which may take
      # several minutes on a slow connection.
      test: ["CMD-SHELL", "clamdscan --ping=3 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - edge      # required for freshclamd signature updates from ClamAV mirrors
      - internal  # retains reachability from backend and celery at clamav:3310
  # Optional TURN/STUN relay for WebRTC calls.
  # Start with: docker compose --profile optional up -d coturn
  # Requires TURN_AUTH_SECRET, TURN_REALM, TURN_EXTERNAL_IP in .env.
  coturn:
    profiles:
      - optional
    # Pinned to a verified stable release — do not change to :latest.
    image: coturn/coturn:4.6.2
    container_name: chat_coturn
    # The entrypoint script writes /tmp/turnserver.conf from environment
    # variables, then exec's turnserver.  Credentials stay out of command-line
    # arguments (visible in `docker inspect .Args`); they reside only in
    # .Config.Env — the same exposure level as every other service here.
    entrypoint: ["/bin/sh", "/coturn-entrypoint.sh"]
    volumes:
      - ./coturn/entrypoint.sh:/coturn-entrypoint.sh:ro
    env_file:
      - .env
    ports:
      # TURN_LISTEN_IP sets the host interface for all TURN ports.
      # Local dev  → set TURN_LISTEN_IP=127.0.0.1 in .env (loopback only)
      # Production → set TURN_LISTEN_IP=0.0.0.0 (all interfaces) or leave unset
      - "${TURN_LISTEN_IP:-0.0.0.0}:3478:3478/udp"
      - "${TURN_LISTEN_IP:-0.0.0.0}:3478:3478/tcp"
      # Relay range: must match TURN_MIN_PORT/TURN_MAX_PORT in .env
      - "${TURN_LISTEN_IP:-0.0.0.0}:${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49200}:${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49200}/udp"
    networks:
      - edge
    restart: unless-stopped


  nginx:
    build:
      context: ..
      dockerfile: backend/nginx/Dockerfile
    image: nexus_chat_nginx:latest
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - static_files:/app/staticfiles:ro
    depends_on:
      - backend
    networks:
      - edge
      - internal
    restart: unless-stopped


volumes:
  postgres_data:
  minio_data:
  redis_data:
  clamav_data:
  static_files:
networks:
  edge:
  internal:
    internal:  true