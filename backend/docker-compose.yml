
services:
  backend:
    build: .
    image: chat_app:latest
    command: >
      sh -c "
        sleep 5 &&
        python manage.py makemigrations &&
        python manage.py migrate &&
        python manage.py createadmin &&
        python -m daphne -b 0.0.0.0 -p 8000 config.asgi:application
      "
    volumes:
      - .:/app
    ports:
      - "8004:8000"
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
      minio:
        condition: service_started
      clamav:
        condition: service_started
    restart: unless-stopped

  celery:
    image: chat_app:latest
    command: celery -A config worker -l info -P solo
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
      - db
      - minio
      - clamav
    restart: unless-stopped

  celery-beat:
    image: chat_app:latest
    command: celery -A config beat -l info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
      - db
      - minio
      - clamav
    restart: unless-stopped

  frontend:
    build:
      context: ../chat-frontend
      dockerfile: Dockerfile
    image: chat_frontend:latest
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - ../chat-frontend:/app
    ports:
      - "5177:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6383:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  db:
    image: postgres:15
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9004:9000"
      - "127.0.0.1:9005:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  clamav:
    image: clamav/clamav:latest
    container_name: chat_clamav
    ports:
      - "127.0.0.1:3314:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    environment:
      - CLAMAV_NO_FRESHCLAMD=false
    restart: unless-stopped

  # Optional TURN/STUN relay for WebRTC calls.
  coturn:
    profiles:
      - optional
    image: coturn/coturn:latest
    container_name: chat_coturn
    command: >
      -n
      --log-file=stdout
      --lt-cred-mech
      --realm=${TURN_REALM:-chatapp.local}
      --user=${TURN_USERNAME:-chatuser}:${TURN_PASSWORD:-changeme}
      --no-cli
      --min-port=49160
      --max-port=49200
      --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    restart: unless-stopped

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  redis_data:
  clamav_data: