
stages:
  - validate
  - build

variables:
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"

validate-compose:
  stage: validate
  image: docker:cli
  services:
    - name: docker:dind
      alias: docker
  before_script:
    - docker info
  script:
    - docker compose -f backend/docker-compose.yml config -q
  rules:
    - if: '$CI_COMMIT_BRANCH'

build-images:
  stage: build
  image: docker:cli
  services:
    - name: docker:dind
      alias: docker
  before_script:
    - docker info
  script:
    - docker build -f backend/Dockerfile -t nexus-chat-backend:$CI_COMMIT_SHORT_SHA backend
    - docker build -f backend/nginx/Dockerfile -t nexus-chat-nginx:$CI_COMMIT_SHORT_SHA .
    - docker build -f chat-frontend/Dockerfile -t nexus-chat-frontend:$CI_COMMIT_SHORT_SHA chat-frontend
  rules:
    - if: '$CI_COMMIT_BRANCH'
